# : Manager [[[

[mgr]
cwd = { fg = "#cdd6f4" }

# Find
find_keyword  = { fg = "#f38ba8", bold = true, italic = true, underline = true }
find_position = { fg = "#f38ba8", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#f5c2e7", bg = "#f5c2e7" }   # 粉色高亮
marker_cut      = { fg = "#f9e2af", bg = "#f9e2af" }   # 黄色高亮
marker_marked   = { fg = "#f38ba8", bg = "#f38ba8" }   # 红色高亮
marker_selected = { fg = "#cba6f7", bg = "#cba6f7" }   # 紫色高亮

# Count
count_copied   = { fg = "#1e1e2e", bg = "#f5c2e7" }
count_cut      = { fg = "#1e1e2e", bg = "#f9e2af" }
count_selected = { fg = "#1e1e2e", bg = "#cba6f7" }

# Border
border_symbol = "│"
border_style  = { fg = "#89b4fa" }

# : ]]]

# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]

# : Tabs [[[

[tabs]
active    = { fg = "#89b4fa", bold = true, bg = "#1e1e2e" }
inactive  = { fg = "#a6adc8", bg = "#1e1e2e" }
sep_inner = { open = "[", close = "]" }

# : ]]]

# : Mode [[[

[mode]
# Normal mode
normal_main = { bg = "#89b4fa", fg = "#1e1e2e", bold = true }
normal_alt  = { bg = "#313244", fg = "#cdd6f4" }

# Select mode
select_main = { bg = "#a6adc8", fg = "#1e1e2e", bold = true }
select_alt  = { bg = "#313244", fg = "#cdd6f4" }

# Unset mode
unset_main = { bg = "#cba6f7", fg = "#1e1e2e", bold = true }
unset_alt  = { bg = "#313244", fg = "#cdd6f4" }

# : ]]]

# : Status [[[

[status]
# sep_left  = { open = "🭁", close = "🭠" }
# sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#89b4fa" }   # 蓝色
perm_write = { fg = "#f5c2e7" }   # 粉色
perm_read  = { fg = "#f38ba8" }   # 红色
perm_exec  = { fg = "#fab387" }   # 橙色
perm_sep   = { fg = "#cba6f7" }   # 紫色

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#89b4fa", bg = "#313244" }
progress_error  = { fg = "#f38ba8", bg = "#313244" }

# : ]]]

# : Which [[[

[which]
cols = 3
mask = { bg = "#313244" }
cand = { fg = "#89b4fa" }
rest = { fg = "#45475a" }   # 暗显
desc = { fg = "#cdd6f4" }
separator = " ▶ "
separator_style = { fg = "#cdd6f4" }

# : ]]]

# : Notify [[[

[notify]
title_info  = { fg = "#cba6f7" }
title_warn  = { fg = "#89b4fa" }
title_error = { fg = "#f38ba8" }

# : ]]]

# : Picker [[[

[pick]
border = { fg = "#89b4fa" }
active = { fg = "#cba6f7", bold = true }
inactive = {}

# : ]]]

# : Input [[[

[input]
border = { fg = "#89b4fa" }
value  = { fg = "#cdd6f4" }

# : ]]]

# : Completion [[[

[cmp]
border = { fg = "#89b4fa", bg = "#45475a" }

# : ]]]

# : Tasks [[[

[tasks]
border  = { fg = "#89b4fa" }
title   = {}
hovered = { fg = "#f5c2e7", underline = true }

# : ]]]

# : Help [[[

[help]
on     = { fg = "#cdd6f4" }
run    = { fg = "#cdd6f4" }
footer = { fg = "#1e1e2e", bg = "#a6adc8" }

# : ]]]

# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },   # 青色

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },   # 黄色

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },   # 粉色

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },   # 绿色

    # Special files
    { url = "*", is = "orphan", bg = "#f38ba8" },   # 红色背景
    { url = "*", is = "exec", fg = "#fab387" },     # 橙色

    # Fallback
    { url = "*", fg = "#cdd6f4" },
    { url = "*/", fg = "#89b4fa" },
]

# : ]]]

# : Icon [[[

[icon]
# ==========================================
# 1. 预设条件 (最高优先级)
# ==========================================
prepend_conds = [
    # 隐藏文件夹 - 暗色半透明
    { if = "dir & hidden", text = "", fg = "#6c7086" },
    
    # 普通文件夹 - 蓝色
    { if = "dir", text = "", fg = "#89b4fa" },
    
    # 损坏的符号链接 - 红色
    { if = "orphan", text = "󰌌", fg = "#f38ba8" },
    # 正常符号链接 - 粉色
    { if = "link", text = "󰌷", fg = "#f5c2e7" },
    
    # 可执行文件 (排除文件夹)
    { if = "exec & !dir", text = "󰆧", fg = "#a6adc8" },

    # 普通隐藏文件 - 暗淡
    { if = "hidden", text = "󰈙", fg = "#6c7086" },
]

# ==========================================
# 2. 预设目录 (特殊文件夹图标与主色调)
# ==========================================
prepend_dirs = [
    # 常用主目录 - 蓝色
    { name = "Desktop", text = "", fg = "#89b4fa" },
    { name = "Documents", text = "󰈙", fg = "#89b4fa" },
    { name = "Downloads", text = "󰇚", fg = "#89b4fa" },
    { name = "Pictures", text = "󰉏", fg = "#89b4fa" },
    { name = "Music", text = "󰎆", fg = "#89b4fa" },
    { name = "Videos", text = "󰕧", fg = "#89b4fa" },
    { name = "Public", text = "", fg = "#89b4fa" },

