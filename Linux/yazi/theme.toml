    { name = "jpeg", text = "󰉏", fg = "#8EC07C" },
    { name = "webp", text = "󰉏", fg = "#8EC07C" },
    { name = "svg", text = "󰜡", fg = "#8EC07C" },
    { name = "mp4", text = "󰕧", fg = "#8EC07C" },
    { name = "mkv", text = "󰕧", fg = "#8EC07C" },
