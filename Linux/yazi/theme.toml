# : Manager [[[

[mgr]
cwd = { fg = "#D4D4D4" }

# Find
find_keyword  = { fg = "#FAB387", bold = true, italic = true, underline = true }
find_position = { fg = "#FAB387", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#73DACA", bg = "#73DACA" }   # 青绿
marker_cut      = { fg = "#EBCB8B", bg = "#EBCB8B" }   # 金色
marker_marked   = { fg = "#8EC07C", bg = "#8EC07C" }   # 绿
marker_selected = { fg = "#83A598", bg = "#83A598" }   # 蓝灰

# Count
count_copied   = { fg = "#1E2326", bg = "#73DACA" }
count_cut      = { fg = "#1E2326", bg = "#EBCB8B" }
count_selected = { fg = "#1E2326", bg = "#83A598" }

# Border
border_symbol = "│"
border_style  = { fg = "#73DACA" }

# : ]]]

# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]

# : Tabs [[[

[tabs]
active    = { fg = "#73DACA", bold = true, bg = "#1E2326" }
inactive  = { fg = "#7A7A7A", bg = "#1E2326" }
sep_inner = { open = "[", close = "]" }

# : ]]]

# : Mode [[[

[mode]
# Normal mode
normal_main = { bg = "#73DACA", fg = "#1E2326", bold = true }
normal_alt  = { bg = "#2D353B", fg = "#D4D4D4" }

# Select mode
select_main = { bg = "#83A598", fg = "#1E2326", bold = true }
select_alt  = { bg = "#2D353B", fg = "#D4D4D4" }

# Unset mode
unset_main = { bg = "#8EC07C", fg = "#1E2326", bold = true }
unset_alt  = { bg = "#2D353B", fg = "#D4D4D4" }

# : ]]]

# : Status [[[

[status]
# Permissions
perm_type  = { fg = "#73DACA" }
perm_write = { fg = "#EBCB8B" }
perm_read  = { fg = "#FB4934" }   # 红
perm_exec  = { fg = "#8EC07C" }
perm_sep   = { fg = "#73DACA" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#73DACA", bg = "#2D353B" }
progress_error  = { fg = "#FB4934", bg = "#2D353B" }

# : ]]]

# : Which [[[

[which]
cols = 3
mask = { bg = "#2D353B" }
cand = { fg = "#73DACA" }
rest = { fg = "#4A4A4A" }
desc = { fg = "#D4D4D4" }
separator = " ▶ "
separator_style = { fg = "#D4D4D4" }

# : ]]]

# : Notify [[[

[notify]
title_info  = { fg = "#83A598" }
title_warn  = { fg = "#EBCB8B" }
title_error = { fg = "#FB4934" }

# : ]]]

# : Picker [[[

[pick]
border = { fg = "#73DACA" }
active = { fg = "#EBCB8B", bold = true }
inactive = {}

# : ]]]

# : Input [[[

[input]
border = { fg = "#73DACA" }
value  = { fg = "#D4D4D4" }

# : ]]]

# : Completion [[[

[cmp]
border = { fg = "#73DACA", bg = "#2D353B" }

# : ]]]

# : Tasks [[[

[tasks]
border  = { fg = "#73DACA" }
title   = {}
hovered = { fg = "#EBCB8B", underline = true }

# : ]]]

# : Help [[[

[help]
on     = { fg = "#D4D4D4" }
run    = { fg = "#D4D4D4" }
footer = { fg = "#1E2326", bg = "#83A598" }

# : ]]]

# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#8EC07C" },

    # Media
    { mime = "{audio,video}/*", fg = "#EBCB8B" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#FAB387" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#8EC07C" },

    # Special files
    { url = "*", is = "orphan", bg = "#5C2E2E" },
    { url = "*", is = "exec", fg = "#8EC07C" },

    # Fallback
    { url = "*", fg = "#D4D4D4" },
    { url = "*/", fg = "#73DACA" },
]

# : ]]]

# : Icon [[[

[icon]
# ==========================================
# 1. 预设条件 (最高优先级)
# ==========================================
prepend_conds = [
    # 隐藏文件夹
    { if = "dir & hidden", text = "", fg = "#4A4A4A" },
    
    # 普通文件夹 - 青绿
    { if = "dir", text = "", fg = "#73DACA" },
    
    # 损坏的符号链接 - 红
    { if = "orphan", text = "󰌌", fg = "#FB4934" },
    # 正常符号链接 - 蓝灰
    { if = "link", text = "󰌷", fg = "#83A598" },
    
    # 可执行文件 (排除文件夹)
    { if = "exec & !dir", text = "󰆧", fg = "#8EC07C" },

    # 普通隐藏文件
    { if = "hidden", text = "󰈙", fg = "#4A4A4A" },
]

# ==========================================
# 2. 预设目录 (特殊文件夹图标与主色调)
# ==========================================
prepend_dirs = [
    # 常用主目录 - 青绿
    { name = "Desktop", text = "", fg = "#73DACA" },
    { name = "Documents", text = "󰈙", fg = "#73DACA" },
    { name = "Downloads", text = "󰇚", fg = "#73DACA" },
    { name = "Pictures", text = "󰉏", fg = "#73DACA" },
    { name = "Music", text = "󰎆", fg = "#73DACA" },
    { name = "Videos", text = "󰕧", fg = "#73DACA" },
    { name = "Public", text = "", fg = "#73DACA" },

    # 开发/配置目录 - 金色
    { name = ".config", text = "", fg = "#EBCB8B" },
    { name = ".git", text = "󰊢", fg = "#EBCB8B" },
    { name = "Github", text = "󰊢", fg = "#EBCB8B" },
    { name = "src", text = "", fg = "#EBCB8B" },
]

# ==========================================
# 3. 预设文件扩展名
# ==========================================
