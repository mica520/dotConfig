# : Manager [[[

[mgr]
cwd = { fg = "#E5E5E5" }

# Find
find_keyword  = { fg = "#E95420", bold = true, italic = true, underline = true }
find_position = { fg = "#E95420", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#FF8C00", bg = "#FF8C00" }   # 亮橙
marker_cut      = { fg = "#F1C40F", bg = "#F1C40F" }   # 黄
marker_marked   = { fg = "#E95420", bg = "#E95420" }   # 主橙
marker_selected = { fg = "#9B3C8E", bg = "#9B3C8E" }   # 紫

# Count
count_copied   = { fg = "#1E1E1E", bg = "#FF8C00" }
count_cut      = { fg = "#1E1E1E", bg = "#F1C40F" }
count_selected = { fg = "#1E1E1E", bg = "#9B3C8E" }

# Border
border_symbol = "│"
border_style  = { fg = "#E95420" }

# : ]]]

# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]

# : Tabs [[[

[tabs]
active    = { fg = "#E95420", bold = true, bg = "#1E1E1E" }
inactive  = { fg = "#A0A0A0", bg = "#1E1E1E" }
sep_inner = { open = "[", close = "]" }

# : ]]]

# : Mode [[[

[mode]
# Normal mode
normal_main = { bg = "#E95420", fg = "#1E1E1E", bold = true }
normal_alt  = { bg = "#2A2A2A", fg = "#E5E5E5" }

# Select mode
select_main = { bg = "#9B3C8E", fg = "#1E1E1E", bold = true }
select_alt  = { bg = "#2A2A2A", fg = "#E5E5E5" }

# Unset mode
unset_main = { bg = "#77216F", fg = "#E5E5E5", bold = true }
unset_alt  = { bg = "#2A2A2A", fg = "#E5E5E5" }

# : ]]]

# : Status [[[

[status]
# Permissions
perm_type  = { fg = "#E95420" }   # 主橙
perm_write = { fg = "#FF8C00" }   # 亮橙
perm_read  = { fg = "#E74C3C" }   # 红
perm_exec  = { fg = "#8AE234" }   # 绿
perm_sep   = { fg = "#77216F" }   # 紫

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#E95420", bg = "#2A2A2A" }
progress_error  = { fg = "#E74C3C", bg = "#2A2A2A" }

# : ]]]

# : Which [[[

[which]
cols = 3
mask = { bg = "#2A2A2A" }
cand = { fg = "#E95420" }
rest = { fg = "#555555" }   # 暗显
desc = { fg = "#E5E5E5" }
separator = " ▶ "
separator_style = { fg = "#E5E5E5" }

# : ]]]

# : Notify [[[

[notify]
title_info  = { fg = "#9B3C8E" }
title_warn  = { fg = "#E95420" }
title_error = { fg = "#E74C3C" }

# : ]]]

# : Picker [[[

[pick]
border = { fg = "#E95420" }
active = { fg = "#9B3C8E", bold = true }
inactive = {}

# : ]]]

# : Input [[[

[input]
border = { fg = "#E95420" }
value  = { fg = "#E5E5E5" }

# : ]]]

# : Completion [[[

[cmp]
border = { fg = "#E95420", bg = "#2A2A2A" }

# : ]]]

# : Tasks [[[

[tasks]
border  = { fg = "#E95420" }
title   = {}
hovered = { fg = "#FF8C00", underline = true }

# : ]]]

# : Help [[[

[help]
on     = { fg = "#E5E5E5" }
run    = { fg = "#E5E5E5" }
footer = { fg = "#1E1E1E", bg = "#9B3C8E" }

# : ]]]

# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#8AE234" },   # 绿色

    # Media
    { mime = "{audio,video}/*", fg = "#F1C40F" },   # 黄色

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#FF8C00" },   # 亮橙

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#8AE234" },   # 绿色

    # Special files
    { url = "*", is = "orphan", bg = "#E74C3C" },   # 红色背景
    { url = "*", is = "exec", fg = "#8AE234" },     # 绿色

    # Fallback
    { url = "*", fg = "#E5E5E5" },
    { url = "*/", fg = "#E95420" },
]

# : ]]]

# : Icon [[[

[icon]
# ==========================================
# 1. 预设条件 (最高优先级)
# ==========================================
prepend_conds = [
    # 隐藏文件夹
    { if = "dir & hidden", text = "", fg = "#555555" },
    
    # 普通文件夹 - 橙色
    { if = "dir", text = "", fg = "#E95420" },
    
    # 损坏的符号链接 - 红色
    { if = "orphan", text = "󰌌", fg = "#E74C3C" },
    # 正常符号链接 - 紫色
    { if = "link", text = "󰌷", fg = "#9B3C8E" },
    
    # 可执行文件 (排除文件夹)
    { if = "exec & !dir", text = "󰆧", fg = "#8AE234" },

    # 普通隐藏文件 - 暗淡
    { if = "hidden", text = "󰈙", fg = "#555555" },
]

# ==========================================
# 2. 预设目录 (特殊文件夹图标与主色调)
# ==========================================
prepend_dirs = [
    # 常用主目录 - 橙色
    { name = "Desktop", text = "", fg = "#E95420" },
    { name = "Documents", text = "󰈙", fg = "#E95420" },
    { name = "Downloads", text = "󰇚", fg = "#E95420" },
    { name = "Pictures", text = "󰉏", fg = "#E95420" },
    { name = "Music", text = "󰎆", fg = "#E95420" },
    { name = "Videos", text = "󰕧", fg = "#E95420" },
    { name = "Public", text = "", fg = "#E95420" },

    # 开发/配置目录 - 紫色
    { name = ".config", text = "", fg = "#9B3C8E" },
    { name = ".git", text = "󰊢", fg = "#9B3C8E" },
    { name = "Github", text = "󰊢", fg = "#9B3C8E" },
    { name = "src", text = "", fg = "#9B3C8E" },
]

# ==========================================
# 3. 预设文件扩展名
# ==========================================
prepend_exts = [
    # 图片/媒体 - 绿色
    { name = "png", text = "󰉏", fg = "#8AE234" },
    { name = "jpg", text = "󰉏", fg = "#8AE234" },
    { name = "jpeg", text = "󰉏", fg = "#8AE234" },
    { name = "webp", text = "󰉏", fg = "#8AE234" },
    { name = "svg", text = "󰜡", fg = "#8AE234" },
    { name = "mp4", text = "󰕧", fg = "#8AE234" },
    { name = "mkv", text = "󰕧", fg = "#8AE234" },
    { name = "mp3", text = "󰎆", fg = "#8AE234" },
    { name = "flac", text = "󰎆", fg = "#8AE234" },

    # 档案/压缩包 - 亮橙
    { name = "zip", text = "󰛫", fg = "#FF8C00" },
    { name = "tar", text = "󰛫", fg = "#FF8C00" },
    { name = "gz", text = "󰛫", fg = "#FF8C00" },
